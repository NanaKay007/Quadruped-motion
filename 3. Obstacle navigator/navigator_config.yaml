# Quadruped Locomotion Training Configuration

env:
  num_actions: 4
  dof_names:
    - fl_hx
    - fr_hx
    - hl_hx
    - hr_hx
    - fl_hy
    - fr_hy
    - hl_hy
    - hr_hy
    - fl_kn
    - fr_kn
    - hl_kn
    - hr_kn
  sensor_params:
    lookat: [5,1,0.3]
    pos: [0,0,0.3]
    euler_offset: [0,0,0]
    fov: 70
  default_joint_angles:  # [rad]
    fl_hx: 0.0
    fr_hx: 0.0
    hl_hx: 0.0
    hr_hx: 0.0
    fl_hy: 0.7
    fr_hy: 0.7
    hl_hy: 0.7
    hr_hy: 0.7
    fl_kn: -1.3
    fr_kn: -1.3
    hl_kn: -1.3
    hr_kn: -1.3
  # PD control
  kp: 350
  kd: 50
  force_lower: -100
  force_upper: 100
  # termination
  termination_if_roll_greater_than: 10  # degrees
  termination_if_pitch_greater_than: 13
  # base pose
  base_init_pos: [0.0, 0.0, 0.5546]
  base_init_quat: [1.0, 0.0, 0.0, 0.0]
  episode_length_s: 20.0
  resampling_time_s: 4.0
  action_scale: 0.25
  simulate_action_latency: true
  clip_actions: 10

observation:
  num_obs: 46
  obs_scales:
    lin_vel: 2.0
    ang_vel: 0.25
    dof_pos: 1.0
    dof_vel: 0.05

reward:
  tracking_sigma: 0.25
  base_height_target: 0.55
  crouch_height: 0.25
  reward_scales:
    tracking_lin_vel: 1.0
    tracking_ang_vel: 1.0
    lin_vel_z: -0.05
    base_height: -50.0
    action_rate: -0.005
    similar_to_default: -0.18
    orientation: -0.002

command:
  num_commands: 4
  lin_vel_x_range: [-1.0, 2.0]
  lin_vel_y_range: [-0.5, 0.5]
  ang_vel_range: [-0.6, 0.6]
  height_range: [0.25, 0.75]

train:
  algorithm:
    class_name: PPO
    clip_param: 0.2
    desired_kl: 0.01
    entropy_coef: 0.01
    gamma: 0.99
    lam: 0.95
    learning_rate: 0.001
    max_grad_norm: 1.0
    num_learning_epochs: 5
    num_mini_batches: 4
    schedule: adaptive
    use_clipped_value_loss: true
    value_loss_coef: 1.0
  policy:
    class_name: ActorCritic
    activation: elu
    actor_hidden_dims: [512, 256, 256, 128]
    critic_hidden_dims: [512, 256, 256, 128]
    init_noise_std: 1.0
  runner:
    class_name: PPO
    checkpoint: -1
    load_run: -1
    log_interval: 1
    policy_class_name: ActorCritic
    record_interval: -1
  class_name: OnPolicyRunner
  run_name: quadruped_motion
  save_interval: 500
  num_steps_per_env: 24
  seed: 1
  logger: tensorboard
  obs_groups:
    policy: [policy]
    critic: [policy]